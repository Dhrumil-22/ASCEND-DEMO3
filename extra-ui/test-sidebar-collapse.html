<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Collapse Test</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #0A0F1E;
        }

        .test-info {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1E293B;
            padding: 20px;
            border-radius: 8px;
            color: white;
            max-width: 300px;
        }

        .test-info h3 {
            margin-top: 0;
        }

        .test-info button {
            margin-top: 10px;
            padding: 8px 16px;
            background: #4DA3FF;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="test-info">
        <h3>Sidebar Collapse Test</h3>
        <p>Click the collapse button in the sidebar.</p>
        <p><strong>Expected:</strong> Icons should remain visible when collapsed.</p>
        <button onclick="reinitIcons()">Re-init Icons</button>
        <button onclick="checkIcons()">Check Icons</button>
        <div id="icon-count" style="margin-top: 10px; font-size: 12px;"></div>
    </div>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">⚡</div>
            <div class="sidebar-logo-text">ASCEND</div>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="sidebar-nav-item active">
                <i data-lucide="layout-dashboard" style="width: 20px; height: 20px; stroke-width: 1.5;"></i>
                <span>Dashboard</span>
            </a>
            <a href="#" class="sidebar-nav-item">
                <i data-lucide="message-circle-question" style="width: 20px; height: 20px; stroke-width: 1.5;"></i>
                <span>Ask Question</span>
            </a>
            <a href="#" class="sidebar-nav-item">
                <i data-lucide="compass" style="width: 20px; height: 20px; stroke-width: 1.5;"></i>
                <span>Career</span>
            </a>
            <a href="#" class="sidebar-nav-item">
                <i data-lucide="users" style="width: 20px; height: 20px; stroke-width: 1.5;"></i>
                <span>Discussion</span>
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-nav-item sidebar-toggle">
                <i data-lucide="chevron-left" style="width: 20px; height: 20px; stroke-width: 1.5;"></i>
                <span>Collapse</span>
            </div>
            <a href="#" class="sidebar-nav-item">
                <i data-lucide="log-out" style="width: 20px; height: 20px; stroke-width: 1.5;"></i>
                <span>Sign Out</span>
            </a>
        </div>
    </aside>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // Sidebar collapse functionality
        const sidebar = document.querySelector('.sidebar');
        const collapseBtn = document.querySelector('.sidebar-toggle');

        if (collapseBtn) {
            collapseBtn.addEventListener('click', () => {
                sidebar.classList.toggle('collapsed');
                console.log('Sidebar collapsed:', sidebar.classList.contains('collapsed'));

                // Re-initialize icons after collapse
                setTimeout(() => {
                    lucide.createIcons();
                    checkIcons();
                }, 100);
            });
        }

        function reinitIcons() {
            lucide.createIcons();
            console.log('Icons re-initialized');
            checkIcons();
        }

        function checkIcons() {
            const iElements = document.querySelectorAll('.sidebar i[data-lucide]');
            const svgElements = document.querySelectorAll('.sidebar svg');
            const collapsed = sidebar.classList.contains('collapsed');

            document.getElementById('icon-count').innerHTML = `
                <strong>Status:</strong> ${collapsed ? 'Collapsed' : 'Expanded'}<br>
                <strong>i elements:</strong> ${iElements.length}<br>
                <strong>SVG elements:</strong> ${svgElements.length}<br>
                <strong>Nav SVGs:</strong> ${document.querySelectorAll('.sidebar-nav svg').length}<br>
                <strong>Footer SVGs:</strong> ${document.querySelectorAll('.sidebar-footer svg').length}
            `;

            console.log('Icon check:', {
                collapsed,
                iElements: iElements.length,
                svgElements: svgElements.length,
                navSvgs: document.querySelectorAll('.sidebar-nav svg').length,
                footerSvgs: document.querySelectorAll('.sidebar-footer svg').length
            });
        }

        // Initial check
        setTimeout(checkIcons, 500);
    </script>
</body>

</html>
